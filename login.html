<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSwap | Account Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between antialiased">

  <!-- TOP BRAND NAV -->
  <header class="bg-slate-900 border-b border-slate-800 text-white">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-7 h-7 rounded-md bg-teal-500 flex items-center justify-center font-mono font-bold text-white text-xs">⇄</div>
        <span class="font-bold text-sm tracking-tight text-white">SmartSwap</span>
      </div>
      <div class="flex items-center space-x-2 text-[11px] text-slate-400 font-mono">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>Recommender Gateway</span>
      </div>
    </div>
  </header>

  <!-- AUTH CARD CONTAINER -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
      
      <!-- TABS -->
      <div class="grid grid-cols-2 border-b border-slate-200 bg-slate-50 text-center font-semibold text-xs">
        <button id="tabLogin" type="button" onclick="switchTab('login')" class="py-3.5 border-b-2 border-teal-600 text-teal-800 bg-white transition">
          Sign In
        </button>
        <button id="tabSignup" type="button" onclick="switchTab('signup')" class="py-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition">
          Create Account
        </button>
      </div>

      <div class="p-6 sm:p-8 space-y-5">
        
        <!-- HEADING -->
        <div>
          <h2 id="authHeading" class="text-base font-bold text-slate-900">Welcome to SmartSwap</h2>
          <p id="authSubheading" class="text-slate-500 text-xs mt-0.5">Access enterprise SaaS optimization & parity scoring</p>
        </div>

        <!-- AUTH FORM -->
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
          
          <div id="companyField" class="hidden">
            <label class="block text-[11px] font-semibold text-slate-700 uppercase tracking-wide mb-1">Company / Organization</label>
            <input type="text" id="companyInput" placeholder="Acme Engineering"
                   class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none" />
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-700 uppercase tracking-wide mb-1">Work Email</label>
            <input type="email" id="emailInput" required placeholder="lead@company.com" value="admin@smartswap.io"
                   class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none" />
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-[11px] font-semibold text-slate-700 uppercase tracking-wide">Password</label>
              <a href="#" class="text-[10px] text-teal-600 hover:underline">Forgot?</a>
            </div>
            <input type="password" id="passwordInput" required placeholder="••••••••" value="demo12345"
                   class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 focus:bg-white focus:outline-none" />
          </div>

          <!-- PRIMARY ACTION BUTTON -->
          <div class="pt-2">
            <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-sm cursor-pointer">
              Sign In to Console
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <footer class="py-3.5 text-center text-slate-400 text-xs font-mono border-t border-slate-200 bg-white">
    SmartSwap SaaS Recommender & Decision Engine
  </footer>

  <script>
    function switchTab(mode) {
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const companyField = document.getElementById('companyField');
      const authHeading = document.getElementById('authHeading');
      const authSubheading = document.getElementById('authSubheading');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'signup') {
        tabSignup.className = "py-3.5 border-b-2 border-teal-600 text-teal-800 bg-white transition";
        tabLogin.className = "py-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition";
        companyField.classList.remove('hidden');
        authHeading.innerText = "Register Your Organization";
        authSubheading.innerText = "Set up your stack baseline to evaluate cost swaps";
        submitBtn.innerText = "Create Workspace Account";
      } else {
        tabLogin.className = "py-3.5 border-b-2 border-teal-600 text-teal-800 bg-white transition";
        tabSignup.className = "py-3.5 border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition";
        companyField.classList.add('hidden');
        authHeading.innerText = "Welcome to SmartSwap";
        authSubheading.innerText = "Access enterprise SaaS optimization & parity scoring";
        submitBtn.innerText = "Sign In to Console";
      }
    }

    function handleAuth(event) {
      event.preventDefault();
      const org = document.getElementById('companyInput').value.trim() || "Fintech Stack Ops";
      sessionStorage.setItem("smartswap_user_org", org);
      window.location.href = "/dashboard";
    }
  </script>
</body>
</html>
